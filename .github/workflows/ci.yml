name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-win:
    name: build windows
    strategy:
      fail-fast: false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p ayatsuri -p ayatsuri-launcher
      - run: cargo test --locked --workspace

  build-nix:
    name: build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04 macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: DeterminateSystems/flake-checker-action@main
      - name: Run `nix build`
        run: nix build .#ayatsuri
        
  capi-win:
    name: C ABI windows
    strategy:
      fail-fast: false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # the library, the header off the source, and the C host run against
      # it where a C compiler is on the path
      - run: cargo xtask capi
      - uses: actions/upload-artifact@v4
        with:
          name: ayatsuri-capi-${{ matrix.os }}
          path: |
            target/capi/ayatsuri.h
            target/capi/LICENSE
            target/capi/libayatsuri_capi.*
            target/capi/ayatsuri_capi.*

  capi-nix:
    name: C ABI ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04 macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: DeterminateSystems/flake-checker-action@main
      - name: Run `nix build`
        run: nix build .#libayatsuri
      - uses: actions/upload-artifact@v4
        with:
          name: ayatsuri-capi-${{ matrix.os }}
          path: |
            result/include/ayatsuri.h
            result/lib/libayatsuri_capi.*
            result/lib/ayatsuri_capi.*
            result/share/doc/libayatsuri/LICENSE
