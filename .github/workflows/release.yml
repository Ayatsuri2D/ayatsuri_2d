name: Release

# Push a tag like v0.5.1 (or run by hand) to build every platform and put
# the packages on a DRAFT pre-release. Nothing is public until someone
# opens the draft on GitHub and presses Publish.
#
# Signing: the .rpm and SHA256SUMS.txt are signed with the release key,
# whose public half is packaging/linux/ayatsuri2d-signing-key.asc. Its
# private half and passphrase are secrets of the release-signing
# environment (RELEASE_GPG_KEY, RELEASE_GPG_PASSPHRASE), so only the jobs
# naming it can read them. The key in the secret must match the committed
# public key, or the run fails. Without the secrets the files go out
# unsigned, with a warning.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux x86_64 (tar.gz, deb, rpm, AppImage)
    # the current Ubuntu runner (glibc 2.39): binaries need that glibc or newer
    runs-on: ubuntu-latest
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Release key
        env:
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
        run: .github/scripts/release-key.sh
      - name: Packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libasound2-dev desktop-file-utils
          curl -fsSL -o nfpm.deb https://github.com/goreleaser/nfpm/releases/download/v2.41.1/nfpm_2.41.1_amd64.deb
          sudo dpkg -i nfpm.deb
      - name: Package
        env:
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NFPM_RPM_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          [ -f "$RUNNER_TEMP/release-key.asc" ] && export RPM_SIGNING_KEY="$RUNNER_TEMP/release-key.asc"
          packaging/linux/package.sh
          rm -f "$RUNNER_TEMP/release-key.asc"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/release/*
          if-no-files-found: error

  windows:
    name: Windows x64 (setup.exe, zip)
    # cross-built with mingw, the same way as on a Linux dev box
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Packaging tools
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 nsis zip
      - name: Package
        run: packaging/windows/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/release/*
          if-no-files-found: error

  macos:
    name: macOS universal (dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Package
        run: packaging/macos/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/release/*
          if-no-files-found: error

  sdk:
    name: SDK ${{ matrix.label }}
    # the C library for each platform: header, libraries, example, licences
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x64, os: ubuntu-latest, args: "" }
          - { label: linux-arm64, os: ubuntu-24.04-arm, args: "" }
          # MSVC, what Unity, Unreal and Visual Studio projects link against
          - { label: windows-x64, os: windows-latest, args: "" }
          - { label: macos-universal, os: macos-latest, args: "--target aarch64-apple-darwin --target x86_64-apple-darwin", targets: "aarch64-apple-darwin, x86_64-apple-darwin" }
          # for the Unity package: Android phones and iOS, built with each
          # platform's own toolchain
          - { label: android-arm64, os: ubuntu-latest, args: "--target aarch64-linux-android", targets: aarch64-linux-android }
          - { label: ios-arm64, os: macos-latest, args: "--target aarch64-apple-ios", targets: aarch64-apple-ios }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets || '' }}
      # one cache per SDK: jobs on the same runner would share one and
      # bring back each other's target/sdk
      - uses: Swatinem/rust-cache@v2
        with:
          key: sdk-${{ matrix.label }}
      - name: Android linker
        if: matrix.label == 'android-arm64'
        shell: bash
        run: |
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$BIN/llvm-ar" >> "$GITHUB_ENV"
      - name: Build and pack
        shell: bash
        run: |
          rm -rf target/sdk
          cargo xtask sdk ${{ matrix.args }} --label ${{ matrix.label }}
      - name: Archive
        shell: bash
        run: |
          mkdir -p dist/release
          cd target/sdk
          NAME=$(ls -d *-${{ matrix.label }})
          if [ "${{ runner.os }}" = Windows ]; then
            # Windows' own tar (bsdtar) writes a zip; Git Bash's GNU tar
            # would write a plain tar under the .zip name
            /c/Windows/System32/tar.exe -a -c -f "../../dist/release/$NAME.zip" "$NAME"
          else
            tar -czf "../../dist/release/$NAME.tar.gz" "$NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.label }}
          path: dist/release/*
          if-no-files-found: error

  unity:
    name: Unity package
    # the SDK libraries for Windows, Linux, macOS, Android and iOS in one
    # tarball for Unity's Package Manager
    needs: [sdk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          path: sdk-downloads
          merge-multiple: true
      - name: Pack
        shell: bash
        run: |
          mkdir -p sdk-unpacked
          for f in sdk-downloads/*.tar.gz; do tar -xzf "$f" -C sdk-unpacked; done
          for f in sdk-downloads/*.zip; do unzip -q "$f" -d sdk-unpacked; done
          cargo xtask unity --pack sdk-unpacked/*
      - uses: actions/upload-artifact@v4
        with:
          name: unity
          path: dist/release/*.tgz
          if-no-files-found: error

  godot:
    name: Godot addon
    # the addon's GDExtension library for Windows, Linux (x64 and ARM64)
    # and macOS, zipped with the addon for a Godot 4 project
    needs: [sdk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          path: sdk-downloads
          merge-multiple: true
      - name: Pack
        shell: bash
        run: |
          mkdir -p sdk-unpacked
          for f in sdk-downloads/*.tar.gz; do tar -xzf "$f" -C sdk-unpacked; done
          for f in sdk-downloads/*.zip; do unzip -q "$f" -d sdk-unpacked; done
          cargo xtask godot --pack sdk-unpacked/*
      - uses: actions/upload-artifact@v4
        with:
          name: godot
          path: target/godot/*.zip
          if-no-files-found: error

  release:
    name: Draft pre-release
    needs: [linux, windows, macos, sdk, unity, godot]
    runs-on: ubuntu-latest
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release key
        env:
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
        run: .github/scripts/release-key.sh
      - name: Sign the checksums
        env:
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          KEY="$RUNNER_TEMP/release-key.asc"
          [ -f "$KEY" ] || { echo "::warning::no release key, SHA256SUMS.txt goes out unsigned"; exit 0; }
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m700 -p "$GNUPGHOME"
          gpg --batch --import "$KEY"
          printf '%s' "$RELEASE_GPG_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
            --armor --detach-sign -o dist/SHA256SUMS.txt.asc dist/SHA256SUMS.txt
          rm -rf "$GNUPGHOME" "$KEY"
          # checked against the committed public key alone, as a user would
          export GNUPGHOME="$RUNNER_TEMP/verify"
          mkdir -m700 -p "$GNUPGHOME"
          gpg --batch --import packaging/linux/ayatsuri2d-signing-key.asc
          gpg --batch --verify dist/SHA256SUMS.txt.asc dist/SHA256SUMS.txt
      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="v$(awk '/^\[workspace.package\]/{p=1;next} /^\[/{p=0} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml)" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft \
              --title "Ayatsuri2D ${TAG#v}" --generate-notes --target "$GITHUB_SHA"
          fi
